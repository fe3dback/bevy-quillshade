[package]
name = "material_domain"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[features]
# Fast incremental builds (`cargo test -p material_domain`); see the root package's feature.
default = ["dynamic_linking"]
dynamic_linking = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true }
bevy_noodle = { workspace = true }
bevy_enhanced_input = { workspace = true }
shader_graph_core = { workspace = true }
shader_stdlib = { workspace = true }
shader_project = { workspace = true }
project_core = { workspace = true }
editor_core = { workspace = true }
node_graph_base = { workspace = true }
curve_kit = { workspace = true, features = ["editor"] }
texture_kit = { workspace = true, features = ["editor"] }
shader_codegen_wesl = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
icon-rs = { workspace = true }
resvg = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
shader_project = { workspace = true }
project_core = { workspace = true }
