[workspace]
resolver = "3"
members = ["crates/shaders"]

[package]
name = "sample_game"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "0.20.0", features = ["file_watcher", "dynamic_linking"] }
shaders = { path = "crates/shaders" }

[profile.dev.package."*"]
opt-level = 3
