[workspace]
resolver = "3"
members = ["crates/*", "vendor/bevy_noodle"]
exclude = ["examples/sample_game"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
# system_clipboard: paste from / copy to other applications (without it the clipboard is in-app only).
# dynamic_linking is the root package's default feature `dynamic_linking`, not set here.
bevy = { version = "0.20.0", features = ["bevy_feathers", "system_clipboard"] }
# Local fork of bevy_noodle 0.5.0 (vendor/bevy_noodle/FORK.md).
bevy_noodle = { path = "vendor/bevy_noodle", features = ["default_style", "scene"] }
# Input contexts of the editor (decision 0032).
bevy_enhanced_input = { version = "0.27", default-features = false }
wesl = { version = "0.6", features = ["naga-ext"] }
naga = { version = "30", features = ["wgsl-in"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
thiserror = "2"
ulid = "1"
notify = "8"
clap = { version = "4", features = ["derive"] }
insta = "1"
tempfile = "3"
toml = "1"
icon-rs = "=0.4.5"
resvg = { version = "0.48", default-features = false }
rfd = "0.17"
# Baked gradient collection PNGs (shader_project) and the png_to_ktx2 dev tool (its example): versions already in
# Bevy 0.20's tree.
png = "0.18"
ktx2 = "0.5"
image = { version = "0.25", default-features = false, features = ["hdr"] }
ruzstd = "0.8"

project_core = { path = "crates/project_core" }
editor_core = { path = "crates/editor_core", default-features = false }
# Without their default `editor` feature: a crate that needs the editor half asks for it.
curve_kit = { path = "crates/curve_kit", default-features = false }
texture_kit = { path = "crates/texture_kit", default-features = false }
shader_graph_core = { path = "crates/shader_graph_core" }
shader_stdlib = { path = "crates/shader_stdlib" }
shader_codegen_wesl = { path = "crates/shader_codegen_wesl" }
shader_codegen_rust = { path = "crates/shader_codegen_rust" }
shader_project = { path = "crates/shader_project" }
# Without their default dynamic_linking: the root package's feature of that name decides.
node_graph_base = { path = "crates/node_graph_base", default-features = false }
material_domain = { path = "crates/material_domain", default-features = false }
# Without its default `editor` feature (the CLI backend is Bevy-free); the root package asks for it.
light_domain = { path = "crates/light_domain", default-features = false }

[package]
name = "bevy-quillshade"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Bevy quillshade editor"
license = "MIT"

[[bin]]
name = "shader-editor"
path = "src/main.rs"

[features]
# Fast incremental builds while developing (bevy/dynamic_linking). Release binaries are built with
# `--no-default-features`: a dynamically linked one needs libbevy_dylib and Rust's libstd next to it.
default = ["dynamic_linking"]
dynamic_linking = [
    "editor_core/dynamic_linking",
    "node_graph_base/dynamic_linking",
    "material_domain/dynamic_linking",
    "curve_kit/dynamic_linking",
    "texture_kit/dynamic_linking",
    "light_domain/dynamic_linking",
]

[dependencies]
clap = { workspace = true }
project_core = { workspace = true }
shader_project = { workspace = true }
editor_core = { workspace = true }
node_graph_base = { workspace = true }
material_domain = { workspace = true }
light_domain = { workspace = true, features = ["editor"] }
# Only to name their `dynamic_linking` features.
curve_kit = { workspace = true }
texture_kit = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The bevy_noodle fork is a workspace member, so `package."*"` above no longer covers it; keep it optimized as when
# it came from crates.io.
[profile.dev.package.bevy_noodle]
opt-level = 3
debug = false

# Release binaries (CI `dist` job): without symbols they are ~40% smaller; panics still name the location.
[profile.release]
strip = true
